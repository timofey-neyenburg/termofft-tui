[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thermofft"
version = "0.1.0"
description = "АИС ThermoFFT — анализ суточных колебаний температуры микроклимата (CLI/TUI)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Korzhavin A.N." },
    { name = "Neyenburg T.A." },
]
license = { text = "Educational" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "sqlalchemy>=2.0",
    "pydantic>=2.4",
    "click>=8.1",
    "rich>=13.5",
    "textual>=0.45",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
thermofft = "thermofft.cli.app:cli"

[tool.setuptools]
packages = [
    "thermofft",
    "thermofft.core",
    "thermofft.storage",
    "thermofft.reporting",
    "thermofft.cli",
    "thermofft.tui",
    "thermofft.tui.screens",
    "thermofft.tui.widgets",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "perf: performance gates (slow); run with `-m perf`",
]
